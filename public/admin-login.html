<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk HR — PT Tre Joy Ease Indonesia</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="logo">TJ</div><div>PT Tre Joy Ease Indonesia<small>Panel HR</small></div></div>
</div>
<div class="login-wrap">
  <span class="eyebrow">Khusus tim HR</span>
  <h1 style="font-size:28px;margin-bottom:18px">Masuk ke panel seleksi</h1>
  <div class="card">
    <div id="errorBox"></div>
    <form id="loginForm">
      <label for="password" style="margin-top:0">Password admin</label>
      <input type="password" id="password" required placeholder="Masukkan password" autocomplete="current-password" />
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px" id="loginBtn">Masuk</button>
    </form>
  </div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errorBox = document.getElementById("errorBox");
  errorBox.innerHTML = ""; errorBox.className = "";
  btn.disabled = true; btn.textContent = "Memeriksa...";
  try {
    const res = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("password").value }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login gagal.");
    sessionStorage.setItem("admin_token", data.token);
    window.location.href = "/admin.html";
  } catch (err) {
    errorBox.textContent = err.message; errorBox.className = "error-box";
    btn.disabled = false; btn.textContent = "Masuk";
  }
});
</script>
</body>
</html>
