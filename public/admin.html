<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Admin — Loket CS Test</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 50;
    padding: 30px 16px;
    overflow-y: auto;
  }
  .detail-overlay.open { display: block; }
  .detail-panel {
    max-width: 760px;
    margin: 0 auto;
    background: var(--ink-soft);
    border: 1px solid var(--line-dark);
    border-radius: var(--radius);
    padding: 28px;
  }
  .kv-row { display:flex; gap:10px; font-size: 14px; margin-bottom:6px; }
  .kv-row .k { width: 160px; color: var(--text-on-ink-soft); flex-shrink:0; }
  .filter-row { display:flex; gap:10px; margin-bottom: 18px; flex-wrap: wrap; }
  .filter-row select, .filter-row input { max-width: 220px; }
  .answer-block { border-top: 1px solid var(--line-dark); padding: 14px 0; }
  .answer-block:first-child { border-top: none; }
  .tag-correct { color: #6FCFC8; font-weight:600; font-size:12px; }
  .tag-wrong { color: var(--red); font-weight:600; font-size:12px; }
</style>
</head>
<body class="theme-admin">

<div class="topbar">
  <div class="brand"><span class="dot"></span> Loket CS Test — Panel Admin</div>
  <button class="btn btn-ghost" id="logoutBtn" style="padding:8px 14px; font-size:13px;">Keluar</button>
</div>

<div class="shell-wide">
  <p class="eyebrow">Hasil Seleksi</p>
  <h1 style="font-size: 28px; margin: 0 0 6px;">Antrian Hasil Test Kandidat</h1>
  <p class="muted" style="margin-bottom: 24px;">Klik salah satu baris untuk melihat jawaban lengkap & transkrip simulasi komplain.</p>

  <div class="filter-row">
    <input type="text" id="searchInput" placeholder="Cari nama / email..." />
    <select id="statusFilter">
      <option value="">Semua status</option>
      <option value="in_progress">Sedang tes pengetahuan</option>
      <option value="knowledge_done">Sedang simulasi komplain</option>
      <option value="completed">Selesai</option>
    </select>
    <button class="btn btn-ghost" id="refreshBtn" style="padding:10px 16px;">↻ Refresh</button>
  </div>

  <div id="errorBox"></div>

  <div class="card" style="padding: 0; overflow-x:auto;">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Kandidat</th>
          <th>Skor MC</th>
          <th>Status</th>
          <th>Waktu Mulai</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" class="muted" style="padding:20px;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel" id="detailPanel">
    <p class="muted">Memuat detail...</p>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
